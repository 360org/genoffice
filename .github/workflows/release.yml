name: Production Release

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version_and_sync:
    name: 0. Verify Sync & Whitelabel Integrity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure upstream & Pull latest code
        shell: bash
        run: |
          echo "=== 1. Checking git remotes and syncing origin/upstream ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch origin
          git fetch origin main

          # Check for unmerged conflicts
          if ! git merge-tree $(git merge-base HEAD origin/main) HEAD origin/main > /dev/null 2>&1; then
            echo "::error::Conflict detected between release commit and origin/main! Aborting release."
            exit 1
          fi

          echo "Sync check against origin/main passed without conflicts."

      - name: Verify Whitelabel Apply & Integrity
        shell: bash
        run: |
          echo "=== 2. Verifying Whitelabel engine application ==="
          npm ci
          node scripts/whitelabel.js apply

          # Verify key files are customized properly without being overwritten
          if ! grep -q "VuaOffice" apps/shell/electron-builder.cjs; then
            echo "::error::Whitelabel verification failed: electron-builder.cjs does not contain VuaOffice!"
            exit 1
          fi

          if ! grep -q "VuaOffice" apps/shell/package.json; then
            echo "::error::Whitelabel verification failed: package.json does not contain VuaOffice!"
            exit 1
          fi

          echo "Whitelabel integrity check passed."

      - id: release
        name: Validate Release Version Tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./apps/shell/package.json').version")"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version, got: $tag" >&2
            exit 1
          fi
          manifest="$(node -p "require('./apps/shell/package.json').version")"
          if [[ "$version" != "$manifest" ]]; then
            echo "Tag $tag does not match package.json ($manifest). Bump the version first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_mac_x64:
    name: 1. macOS Intel
    needs: version_and_sync
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install dependencies & Apply Whitelabel
        run: |
          npm ci
          node scripts/whitelabel.js apply
      - name: Build macOS Intel (x64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:mac:x64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS Intel Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/latest-mac.yml

  build_mac_arm64:
    name: 2. macOS Silicon (arm64)
    needs: version_and_sync
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies & Apply Whitelabel
        run: |
          npm ci
          node scripts/whitelabel.js apply
      - name: Build macOS Silicon (arm64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:mac:arm64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS Silicon Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/latest-mac.yml

  build_windows_x64:
    name: 3. Windows (x64)
    needs: version_and_sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies & Apply Whitelabel
        run: |
          npm ci
          node scripts/whitelabel.js apply
      - name: Build Windows (x64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:win:x64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
      - name: Upload Windows x64 Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/shell/release/*.exe
            apps/shell/release/latest.yml

  build_windows_x86:
    name: 4. Windows (x86)
    needs: version_and_sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Install dependencies & Apply Whitelabel
        run: |
          npm ci
          node scripts/whitelabel.js apply
      - name: Build Windows (x86)
        run: |
          npm run notices
          npm run build:all
          npm run dist:win:ia32 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
      - name: Upload Windows x86 Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: |
            apps/shell/release/*.exe

  build_linux:
    name: 5. Linux 22.04/24.04 (AppImage & deb)
    needs: version_and_sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies & Apply Whitelabel
        run: |
          npm ci
          node scripts/whitelabel.js apply
      - name: Build Linux (AppImage & deb)
        run: |
          npm run notices
          npm run build:all
          npm run dist:linux -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/latest-linux.yml

  publish_release:
    name: 6. Publish Official Release
    needs: [version_and_sync, build_mac_x64, build_mac_arm64, build_windows_x64, build_windows_x86, build_linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version_and_sync.outputs.tag }}
          name: VuaOffice ${{ needs.version_and_sync.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
