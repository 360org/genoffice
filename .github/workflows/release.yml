name: Production Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: release
        name: Take the version from the tag that triggered this run
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./apps/shell/package.json').version")"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version, got: $tag" >&2
            exit 1
          fi
          manifest="$(node -p "require('./apps/shell/package.json').version")"
          if [[ "$version" != "$manifest" ]]; then
            echo "Tag $tag does not match package.json ($manifest). Bump the version first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_mac_x64:
    name: 1. macOS Intel (x64)
    needs: version
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build macOS Intel (x64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:mac:x64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload macOS Intel Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: apps/shell/release/*

  build_mac_arm64:
    name: 2. macOS Silicon (arm64)
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build macOS Silicon (arm64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:mac:arm64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload macOS Silicon Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: apps/shell/release/*

  build_windows:
    name: 3. Windows 10/11 (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm ci
      - name: Build Windows (x64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:win -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: apps/shell/release/*

  build_linux:
    name: 4. Linux 22.04/24.04 (AppImage & deb)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build Linux (AppImage & deb)
        run: |
          npm run notices
          npm run build:all
          npm run dist:linux -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: apps/shell/release/*

  publish_release:
    name: 5. Publish Official Release
    needs: [version, build_mac_x64, build_mac_arm64, build_windows, build_linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: VuaOffice ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
